name: Release Developer ID DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        run: |
          swift --version
          swift test

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${CERT_BASE64:-}" || -z "${CERT_PASSWORD:-}" || -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "::error::Missing Developer ID certificate secrets."
            exit 1
          fi

          echo "$CERT_BASE64" | base64 --decode > developer-id.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import developer-id.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning
          rm -f developer-id.p12

      - name: Configure notary credentials
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [[ -z "${KEY_ID:-}" || -z "${ISSUER_ID:-}" || -z "${API_KEY_BASE64:-}" ]]; then
            echo "::error::Missing App Store Connect API key secrets."
            exit 1
          fi

          echo "$API_KEY_BASE64" | base64 --decode > "AuthKey_${KEY_ID}.p8"
          xcrun notarytool store-credentials mouseportal-notary \
            --key "AuthKey_${KEY_ID}.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID"
          rm -f "AuthKey_${KEY_ID}.p8"

      - name: Build signed notarized DMG
        env:
          APP_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APP_IDENTITY }}
          NOTARY_PROFILE: mouseportal-notary
          ARCHS: arm64 x86_64
        run: |
          if [[ -z "${APP_SIGN_IDENTITY:-}" ]]; then
            echo "::error::Missing DEVELOPER_ID_APP_IDENTITY secret."
            exit 1
          fi

          ./tools/package-developer-id.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MousePortal-DMG
          path: |
            dist/developer-id/*.dmg
            dist/developer-id/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/developer-id/*.dmg \
            dist/developer-id/*.sha256 \
            --title "MousePortal $GITHUB_REF_NAME" \
            --notes "Signed and notarized MousePortal release."
